# WCH OpenOCD config for CH59x (CH591/CH592) over WCH-LinkE (SDI).
#
# The stock wch-riscv.cfg omits the target chip-type index, so the LinkE
# defaults to another family's SDI parameters and "fails to connect with
# riscvchip". MRS's own CH59X-flash.json carries "id": 11, and minichlink
# sends the same value (CHIP_CH59x = 0x0b) as the LinkE chip type. Setting
# it here is what lets the LinkE establish SDI to a CH592. (The stock cfg
# happens to work on CH570/2, whose id is 139 — a different family index.)
adapter driver wlinke
adapter speed 6000
transport select sdi

wlink_set_address 0x00000000
wlink_set_index 11

set _CHIPNAME wch_riscv
sdi newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00001

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME.0 wch_riscv -chain-position $_TARGETNAME
$_TARGETNAME.0 configure -work-area-phys 0x20000000 -work-area-size 0x1000 -work-area-backup 1

echo "CH59x SDI config loaded"
