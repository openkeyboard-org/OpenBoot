[package]
name = "openboot"
version = "0.11.0"
edition = "2021"
rust-version = "1.87"
description = "Host tool for the OpenBoot IAP bootloader on WCH CH570/CH572/CH591/CH592 (OBP v0.2 over USB HID or UART)"
license = "Apache-2.0"

[lib]
name = "openboot"
path = "src/lib.rs"

[[bin]]
name = "openboot"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command-line front end. A program that only links the library can turn
# this off to leave out the argument parser.
cli = ["dep:clap"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
crc32fast = "1"
hidapi = "2"
serialport = "4"
thiserror = "2"

[profile.release]
strip = true
